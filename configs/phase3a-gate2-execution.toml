[data]
start = "2020-01-01T00:00:00Z"
end_exclusive = "2025-09-01T00:00:00Z"
rows = 2978475
gap_ranges = 15
missing_minutes = 2325
cross_month_boundary_gap_minutes = 0
construction = "single_concatenated_series"
keep_columns = ["open_time", "open", "high", "low", "close", "volume", "quote_asset_volume", "number_of_trades", "taker_buy_base_asset_volume", "taker_buy_quote_asset_volume"]
project_out_columns = ["close_time", "close_time_raw", "open_time_raw", "ignore"]
interpolation = "forbidden"
row_deletion = "forbidden"
primary_data_source = "Gate 1 monthly archives, unchanged (daily archives are never substituted)"

[close_time]   # C-1 (D-039: two kinds, never called normal truncated bars)
rule_all_rows = "close_time < open_time + 60s"
normal_ms = "open_time + 59.999s"
normal_us = "open_time + 59.999999s"
provenance = "RL read open_time/close_time of Gate 1 parquet on 2026-11-10; manifest stores counts only; PF-3 re-derives"
kind_rule = "zero_trade_placeholder iff number_of_trades == 0 and volume == 0 and open == high == low == close; otherwise truncated_with_trades"
anomalies = [
  { open = "2020-02-19T11:35:00Z", close = "2020-02-19T11:35:32.286Z", kind = "truncated_with_trades" },
  { open = "2020-03-04T09:21:00Z", close = "2020-03-04T09:21:46.694Z", kind = "truncated_with_trades" },
  { open = "2020-12-21T14:09:00Z", close = "2020-12-21T13:47:20.521Z", kind = "zero_trade_placeholder" },
  { open = "2021-02-11T03:40:00Z", close = "2021-02-11T03:40:54.773Z", kind = "zero_trade_placeholder" },
  { open = "2021-04-25T04:00:00Z", close = "2021-04-25T04:00:58.146Z", kind = "truncated_with_trades" },
  { open = "2021-08-13T01:59:00Z", close = "2021-08-13T01:59:59.000Z", kind = "truncated_with_trades" },
  { open = "2021-12-24T04:59:00Z", close = "2021-12-24T04:59:54.362Z", kind = "truncated_with_trades" },
  { open = "2023-03-24T12:39:00Z", close = "2023-03-24T12:39:41.646Z", kind = "zero_trade_placeholder" },
]

[hac]   # C-2
within_month = "quantforge.power_reanalysis.monthly_stat (unmodified)"
segment_rule = "independent_continuous_segments_zero_cross_segment_covariance"
assumption_statement = "Independence of contiguous segments within a month and zero cross-segment covariance are model assumptions, not verified facts; the direction of any standard-error bias is not asserted in advance."
disclose_per_month = ["segment_count", "segment_lengths", "lag", "limitations"]
lag_basis = "LLSW = max(60, ceil(1.3*sqrt(T_m))) from the month total valid evaluation count T_m, not per segment"
monthly_row_drop = ["pooling", "month_count"]
monthly_row_rename = { weights = "segment_weights_json", cross_month_covariance = "cross_segment_covariance" }
monthly_row_add = ["segment_count", "min_segment_length", "segment_rule"]
lrv_multi_segment = "variance * n"
concentration = "unchanged frozen grid kernel; descriptive"

[gates]
real_ridge_fits_per_run = 224
sensitivity_ridge_fits_per_run = 56
total_ridge_fits_per_run = 280
total_ridge_fits_authorized = 560
real_data_process_launches = 3
n_train_min = 50000
feature_undefined_ratio_max_per_calendar_month = 0.01
primary_segment_rule = "every h=15 evaluation segment length > month LLSW"
index_sha256_encoding = "sha256(DatetimeIndex.as_unit('ns').asi8 little-endian int64 bytes)"

[resources]
run_seconds_max = 7200
peak_process_bytes_max = 17179869184
rehearsal_fraction_max = 0.5
disk_free_bytes_min = 8589934592
cpu_threads = 1

[interpretation]   # C-3 (D-039 wording)
z_one_sided = 1.6448536269514722
FR1 = "S_dep1.p_value >= 0.05 or S_dep1.mean <= 0 or undefined"
FR2 = "any S_dep2 block length ci_low <= 0 or undefined"
FR3 = "descriptive flag only (does not change the class): S_dep3.month_equal.t < z_one_sided or sign(month_equal.mean) != sign(n_weighted.mean) or undefined"
classification_triggers = ["FR1", "FR2"]
R_A = "primary rejects, FR1 and FR2 not triggered"
R_B = "primary rejects, FR1 or FR2 triggered"
R_B_wording = "主检验拒绝 H0，但对跨月依赖假设或月份加权口径存在预先定义的稳健性警报"
R_C = "primary does not reject -> complete negative result, no upgrade"
se_calibration = [8.183772420015648e-10, 9.039421973465615e-10]
se_ratio_highlight_outside = [0.5, 2.0]
placebo_disclose = ["empirical_one_sided_p", "mc_interval_low", "mc_interval_high", "placebo_t_mean", "placebo_t_sd", "pipeline_warning"]

[sensitivity]   # S-DQ (D-056): data-quality sensitivity, frozen before any real fit; result-blind inputs only
name = "S_DQ_conflict_mask"
source = "D-055 final-v2 conflict-minutes.csv: D-039 + D-041 + D-043, 2,070/2,070 verified days"
conflict_minutes = 157
conflict_classes = ["value_conflict", "extra_in_monthly"]
spec = "v1"
horizon = 15
baseline = "zero"
metric = "CW"
mask_rule = "drop decision bar i from training and evaluation iff some conflict open_time p satisfies i-60 <= p <= i+15 minutes on the 1-minute open_time grid"
mask_scope = "U (window upper bound, archive_verification_full.contamination_artifacts)"
eval_short_segment_rule = "after masking, drop every evaluation segment of length <= LLSW(T_post_mask) of that month; final lag = LLSW(T_final)"
train_short_segment_rule = "none"
fit = "same frozen fit_predict_fold on a fold whose train/eval indices are filtered; frozen code unchanged"
decision_lag = "LLSW"
decision_pooling = "n_weighted"
descriptive_pooling = ["month_equal"]
level = 0.05
label_if_decisions_differ = "data_source_sensitive"
label_if_decisions_agree = "data_source_robust"
label_if_undefined = "data_source_sensitive"
changes_primary_decision = false
expected_structural = { masked_valid_bars_all_months = 2068, masked_eval_bars = 1712, eval_months_affected = 10, short_segments_dropped = 1, short_segment_month = "2021-12", short_segment_bars = 15 }
expected_structural_note = "Gap-only structural values computed by the Research Lead from manifest gaps and the conflict list; actual values may differ only through undefined-feature rows and must match the independent oracle."

[evidence_labels]
core = "historical_external_validation_frozen_design_2026"
sensitivity = "prespecified_data_quality_sensitivity"
placebo = "exploratory_prespecified_historical"
placebo_call_label = "exploratory_post_hoc"
gw_coverage_scope = "calendar_month_mature_valid_1m_targets_gaps_not_filled"
rehearsal = "rehearsal_synthetic_engineering_only"
download_plan_note = "frozen offline Phase 3A planning artifact; acquisition status is the Gate 1 manifest"

[report]
banned_claims = ["交易或超额收益意义的 alpha", "可盈利", "可交易", "可泛化", "适用于未来", "已确认的预测能力", "tradable alpha", "profitable", "generalizes", "confirmed predictive power"]

[output]
formal = "results/phase3a/gate2/formal-{utc}-{c2_short_sha}"
reproduction = "results/phase3a/gate2/reproduction-{utc}-{c2_short_sha}"
rehearsal = "results/phase3a/gate2-rehearsal/{utc}"
runtime_only_fields = ["mode", "output_directory", "utc_timestamps", "head_sha", "pid", "elapsed_seconds", "peak_process_bytes"]
