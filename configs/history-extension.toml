total = 68
start = "2020-01-01T00:00:00Z"
end = "2025-09-01T00:00:00Z"

[budget]
zip_bytes = 402653184
checksum_bytes = 1048576
disk_reserve_bytes = 8589934592
ridge_fits_per_run = 224
formal_synthetic_runs = 2
process_memory_bytes = 4000000000
run_seconds = 1200

[download]
authorized = false
max_concurrent = 1
per_month_retry = 3
backoff_seconds = [1, 4, 16]
official_checksum_required = true
estimated_month_zip_bytes = [2097152, 4718592]
per_zip_limit_bytes = 8388608
per_csv_limit_bytes = 33554432
per_checksum_limit_bytes = 16384

[timestamp]
ms_window_end = "2024-12-31T23:59:59.999Z"
us_window_start = "2025-01-01T00:00:00Z"
detection = "per_month_from_first_row_magnitude"
cross_validate = true

[model]
ridge_alpha = 1.0
solver = "svd"
fit_intercept = true
scaler = "train_only_StandardScaler"
baselines = ["zero", "historical_mean"]
specifications = ["v1", "v2"]

[inference]
lags = [60, 275, "LLSW"]
llsw_constant = 1.3
llsw_min_lag = 60
admissible_min_lag_multiple = 4
pooling = ["n_weighted", "month_equal"]
alpha = 0.05
primary_test = "CW"
primary_alternative = "greater"
ic_alternative = "greater"
dm_alternative = "two-sided"
secondary_family = ["S1", "S2", "S3", "S4", "S5"]
secondary_adjustment = "holm"

[dependence]
primary = "within_month_HAC_zero_cross_month"
sensitivities = ["monthly_mean_hac_nw1994", "block_bootstrap", "equal_vs_nweighted"]
monthly_lag = 4
block_lengths = [3, 6, 12]
bootstrap_draws = 2000
confidence = 0.95
bootstrap_method = "circular_percentile"
quantile_method = "linear"

[placebo]
scope = "v1_15m_zero_primary"
sign_flip_block_minutes = 60
sign_flip_draws = 500
time_shift_minutes = 1440
pooling = "n_weighted"
lags = [60, 275]
include_llsw = true
quantiles = [0.025, 0.5, 0.975]
mean_abs_limit = 0.3
sd_min = 0.8
sd_max = 1.25
role_id = 0

[specification]
v1_features = ["log_return_1m", "log_return_5m", "log_return_15m", "log_return_60m", "return_std_5m", "return_std_15m", "return_std_60m", "volume_change_1m", "volume_zscore_60m", "taker_buy_volume_ratio", "trades_change_60m", "log_high_low", "log_close_open", "close_range_position"]
v2_drop_features = ["log_close_open"]
v2_derived_from = "phase2e_spec_audit_2026-11-04"
v2_evidence_tag = "post_hoc_specification_evaluated_on_earlier_data"

[conditional_gw]
instrument = "realized_vol_prev_month"
info_set_rule = "label_available_time_le_fit_time"
instrument_horizon_minutes = 1
instrument_formula = "sqrt(sum(mature_previous_calendar_month_1m_target_return_squared))"
bins = [0.0, 0.25, 0.5, 0.75, 1.0]
hac_lag = 4
loss = "primary_dm_month_mean"
wald_null = "intercept_and_slope_zero"
evidence_level = "exploratory_not_in_holm"

[stability]
window_months = 12
label = "trailing_window_end"
scope = "primary_cw_month_mean"
outputs = ["signed_mean", "absolute_mean"]
evidence_level = "exploratory_descriptive"

[concentration]
top_k = [1, 10, 100]
scope = "primary_cw_within_month"

[encompassing]
scope = "primary_v1_15m_zero"
effective_n = "within_month_cw_hac"

[synthetic]
minutes_per_month = 4096
burnin = 1024
ar_phi = 0.2
garch_omega = 0.00000001
garch_alpha = 0.05
garch_beta = 0.9
student_df = 5
initial_price = 100.0
